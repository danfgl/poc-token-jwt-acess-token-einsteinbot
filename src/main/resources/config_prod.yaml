# PROD

sf:
  token:
    host: "<org-prod>.my.salesforce.com"
  jwt:
    keystorePath: "certs/sf-jwt-prod.pfx"
    keystorePassword: "![...]"
    clientId: "![...]"
    username: "<usuario.integracao>@<dominio>"
    audience: "https://login.salesforce.com"

# Interaction Service API (BYOC)
byoc:
  host: "<org-prod>.my.salesforce-scrt.com"   # host SCRT (nao e o my.salesforce.com)
  orgId: "<orgId-prod>"
  authorizationContext: "<conversationChannelDefinition-prod>"   # DeveloperName do Conversation Channel Definition
  channelAddressId: "<channelAddressId-prod>"   # campo "to" da interacao
