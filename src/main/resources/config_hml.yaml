# HML - sandbox de homologação

sf:
  token:
    host: "<org-hml>.sandbox.my.salesforce.com"
  jwt:
    keystorePath: "certs/sf-jwt-hml.pfx"
    keystorePassword: "![...]"
    clientId: "![...]"
    username: "<usuario.integracao>@<dominio>.hml"
    audience: "https://test.salesforce.com"

# Interaction Service API (BYOC)
byoc:
  host: "<org-hml>.sandbox.my.salesforce-scrt.com"   # host SCRT (nao e o my.salesforce.com)
  orgId: "<orgId-hml>"
  authorizationContext: "<conversationChannelDefinition-hml>"   # DeveloperName do Conversation Channel Definition
  channelAddressId: "<channelAddressId-hml>"   # campo "to" da interacao
